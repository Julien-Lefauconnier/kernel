name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tooling + test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U build twine pytest hypothesis pynacl

      - name: Install package (editable)
        run: |
          python -m pip install -e .

      - name: Run tests
        run: |
          pytest -q

      - name: Build sdist/wheel
        run: |
          rm -rf dist build
          python -m build

      - name: Twine check
        run: |
          python -m twine check dist/*

      - name: Verify py.typed present in wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(whl) as z:
            names = z.namelist()
          assert any(n.endswith("veramem_kernel/py.typed") for n in names), "py.typed missing from wheel"
          print("OK: py.typed present in wheel")
          PY

      - name: Upload dist artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
